<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Верстка сайта</title>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
          <a href="#"><img src="image/Group 14.svg" alt="Логотип" /> </a>
        </div>
        <nav>
          <ul class="navigation-list">
            <li class="navigation-item"><a href="#">Home</a></li>
            <li class="navigation-item"><a href="#">Listing</a></li>
            <li class="navigation-item"><a href="#">Property</a></li>
            <li class="navigation-item"><a href="#">Agents</a></li>
            <li class="navigation-item"><a href="#">Blog</a></li>
          </ul>
        </nav>
        <a href="#" class="button sign-in">Sign In</a>
      </div>
    </header>
    <main>
      <section class="promo">
        <div class="container">
          <h1>Easy way to find a home that’s perfect for you</h1>
          <p>
            The find and most trusted marketplace of design & build house in the
            world.
          </p>
          <div class="property-services">
            <hr />
            <ul class="options-list">
              <li class="options-item">Rent</li>
              <li class="options-item">Buy</li>
              <li class="options-item">Sell</li>
            </ul>

            <div class="price-listings">
              <div>
                <p>Location</p>
                <p class="location">Los Angels</p>
              </div>
              <div>
                <p>Property Type</p>
                <p class="property-type">Delux</p>
              </div>
              <div>
                <p>Average Price</p>
                <p class="price">$7000 - 8000</p>
              </div>
            </div>
            <a href="#" class="button search">Search</a>
          </div>
        </div>
        <img src="image/house.png" alt="house" />
      </section>
    </main>
  </body>
</html>
